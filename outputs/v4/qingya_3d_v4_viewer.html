<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>青芽BUD · 灵动可爱版</title>
<style>
  :root{--bg1:#f8f5f2;--bg2:#f0ebe5;--ink:#4a3f35;--muted:#9a8d80;--accent:#7ecba1;--accent2:#e8a8b8;--warn:#c66b3b}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  header{padding:14px 24px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border-bottom:1px solid rgba(126,203,161,.2);display:flex;align-items:center;justify-content:space-between;z-index:10}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .meta{font-size:12px;color:var(--muted)}
  .stage{flex:1;position:relative;overflow:hidden}
  #canvas{width:100%;height:100%;display:block;cursor:grab}
  #canvas:active{cursor:grabbing}
  #loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--bg1),var(--bg2));z-index:5;transition:opacity .5s}
  #loader.hidden{opacity:0;pointer-events:none}
  #loader .title{font-size:22px;font-weight:500;margin-bottom:18px}
  #loader .sub{font-size:13px;color:var(--muted);margin-bottom:28px}
  .pw{width:320px;height:6px;background:rgba(126,203,161,.2);border-radius:999px;overflow:hidden}
  .pb{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .2s}
  .pt{margin-top:12px;font-size:12px;color:var(--muted)}
  #status{position:absolute;left:24px;top:24px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:14px;padding:10px 14px;font-size:12px;color:var(--muted);border:1px solid rgba(126,203,161,.3);z-index:4;max-width:260px}
  #status strong{color:var(--ink)}
  .controls{position:absolute;left:24px;bottom:24px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:20px;padding:16px 18px;border:1px solid rgba(126,203,161,.3);box-shadow:0 4px 24px rgba(74,63,53,.08);z-index:4}
  .controls .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .controls .row:last-child{margin-bottom:0}
  .controls label{font-size:12px;color:var(--muted);min-width:56px}
  .controls input[type=range]{flex:1;accent-color:var(--accent)}
  .controls button{border:1.5px solid rgba(126,203,161,.4);background:#fff;color:var(--ink);font-size:12px;padding:6px 14px;border-radius:999px;cursor:pointer;transition:all .2s}
  .controls button:hover{background:var(--accent);color:#fff}
  .controls button.active{background:var(--accent);color:#fff}
  .preset{display:flex;gap:6px;flex-wrap:wrap}
  .err{color:var(--warn);font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>🌱 青芽BUD · 灵动可爱版</h1><div class="meta">比例不变 · 柔和曝光 · 粒子环绕</div></div>
    <div class="meta" id="meta-stats">初始化...</div>
  </header>
  <div class="stage">
    <canvas id="canvas"></canvas>
    <div id="loader">
      <div class="title">青芽正在醒来 🌱</div>
      <div class="sub">本地加载 3.1MB 模型</div>
      <div class="pw"><div class="pb" id="bar"></div></div>
      <div class="pt" id="bar-text">0%</div>
      <div class="err" id="err-msg"></div>
    </div>
    <div id="status"><div><strong>青芽BUD</strong></div><div id="status-text">初始化...</div></div>
    <div class="controls">
      <div class="row"><label>自动旋转</label><button id="btn-rotate" class="active">开</button></div>
      <div class="row"><label>灵浮动效</label><button id="btn-bounce" class="active">开</button></div>
      <div class="row"><label>粒子环绕</label><button id="btn-hearts" class="active">开</button></div>
      <div class="row"><label>泛光</label><button id="btn-bloom">关</button></div>
      <div class="row"><label>视角</label><div class="preset">
        <button data-view="front">正面</button><button data-view="side">侧面</button>
        <button data-view="back">背面</button><button data-view="cute">怼脸</button>
      </div></div>
      <div class="row"><label>浮动幅度</label><input type="range" id="bounciness" min="10" max="100" value="50"></div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/"
  }
}
</script>
<script type="module">
const statusEl = document.getElementById('status-text');
const errEl = document.getElementById('err-msg');
const metaEl = document.getElementById('meta-stats');
const loaderEl = document.getElementById('loader');
const barEl = document.getElementById('bar');
const barTextEl = document.getElementById('bar-text');

function setStatus(m) { statusEl.textContent = m; console.log('[青芽]', m); }

try {
  setStatus('加载 Three.js 模块...');
  const THREE = await import('three');
  const { OrbitControls } = await import('./lib/OrbitControls.js');
  const { GLTFLoader } = await import('./lib/GLTFLoader.js');
  const { RoomEnvironment } = await import('./lib/RoomEnvironment.js');
  const { EffectComposer } = await import('./lib/EffectComposer.js');
  const { RenderPass } = await import('./lib/RenderPass.js');
  const { UnrealBloomPass } = await import('./lib/UnrealBloomPass.js');
  setStatus('模块加载成功 ✓');

  const canvas = document.getElementById('canvas');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf8f5f2);
  scene.fog = new THREE.Fog(0xf8f5f2, 8, 20);

  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(1.8, 1.2, 2.8);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.12, 0.4, 0.85);
  composer.addPass(bloomPass);

  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / r.height;
    camera.updateProjectionMatrix();
    composer.setSize(r.width, r.height);
  }
  addEventListener('resize', resize);

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0.6, 0);
  controls.minDistance = 1.0;
  controls.maxDistance = 6.0;

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  // Lights - soft, no overexposure
  scene.add(new THREE.HemisphereLight(0xfff5ea, 0xc8ddd0, 0.7));
  const key = new THREE.DirectionalLight(0xfff5ee, 1.0); key.position.set(2,4,3); scene.add(key);
  const fill = new THREE.DirectionalLight(0xc8ddd5, 0.5); fill.position.set(-2,2,-1); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xf0d0b8, 0.35); rim.position.set(-1,3,-3); scene.add(rim);

  // Ground
  (() => {
    const p = new THREE.Mesh(
      new THREE.CylinderGeometry(1.2, 1.4, 0.08, 32),
      new THREE.MeshStandardMaterial({ color: 0xe8e0d5, roughness: 0.9, transparent: true, opacity: 0.5 })
    );
    p.position.y = -0.04;
    scene.add(p);
  })();

  // === Particles (bigger, more visible) ===
  function makeCircleTex(color) {
    const c = document.createElement('canvas'); c.width=32; c.height=32;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(16,16,2,16,16,14);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.fillRect(0,0,32,32);
    return new THREE.CanvasTexture(c);
  }

  // Green spore particles (larger, more visible)
  const SN=50, sGeo=new THREE.BufferGeometry(), sP=new Float32Array(SN*3), sS=new Float32Array(SN), sPh=new Float32Array(SN);
  for(let i=0;i<SN;i++){const a=Math.random()*Math.PI*2,r=.4+Math.random()*1.4;sP[i*3]=Math.cos(a)*r;sP[i*3+1]=Math.random()*2.8;sP[i*3+2]=Math.sin(a)*r;sS[i]=.15+Math.random()*.35;sPh[i]=Math.random()*Math.PI*2}
  sGeo.setAttribute('position',new THREE.BufferAttribute(sP,3));
  const sMat=new THREE.PointsMaterial({
    map: makeCircleTex('rgba(150,230,170,0.8)'),
    size:.06, transparent:true, opacity:.55,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  scene.add(new THREE.Points(sGeo,sMat));

  // Warm pink glow particles
  const PN=30, pGeo=new THREE.BufferGeometry(), pP=new Float32Array(PN*3), pS=new Float32Array(PN), pPh=new Float32Array(PN);
  for(let i=0;i<PN;i++){const a=Math.random()*Math.PI*2,r=.6+Math.random()*1.6;pP[i*3]=Math.cos(a)*r;pP[i*3+1]=Math.random()*3-.3;pP[i*3+2]=Math.sin(a)*r;pS[i]=.12+Math.random()*.3;pPh[i]=Math.random()*Math.PI*2}
  pGeo.setAttribute('position',new THREE.BufferAttribute(pP,3));
  const pMat=new THREE.PointsMaterial({
    map: makeCircleTex('rgba(255,180,190,0.6)'),
    size:.05, transparent:true, opacity:.45,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  scene.add(new THREE.Points(pGeo,pMat));

  // === Load model ===
  setStatus('场景就绪，加载模型...');
  const gltfLoader = new GLTFLoader();
  let modelGroup=null, bounceOn=true, particlesOn=true, bloomOn=false, autoRot=true, bounciness=0.5;

  gltfLoader.load('./qingya_3d_v4_vivid.glb',
    (gltf) => {
      setStatus('模型加载成功 ✓');
      const model = gltf.scene;
      model.traverse(o => { if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material)o.material.side=THREE.FrontSide} });
      const box=new THREE.Box3().setFromObject(model), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
      const sc=1.6/Math.max(size.x,size.y,size.z);
      model.scale.setScalar(sc); model.position.sub(center.multiplyScalar(sc)); model.position.y+=size.y*sc/2;
      modelGroup=new THREE.Group(); modelGroup.add(model); scene.add(modelGroup);
      controls.target.set(0, size.y*sc/2, 0);
      let fc=0,mc=0; model.traverse(o=>{if(o.isMesh){fc+=o.geometry.index?o.geometry.index.count/3:o.geometry.attributes.position.count/3;mc++}});
      metaEl.textContent=`${(fc/1000).toFixed(1)}K面 · 灵动模式 ✓`;
      loaderEl.classList.add('hidden'); setTimeout(()=>loaderEl.remove(),600);
    },
    (xhr) => {
      const p=xhr.total?Math.round(xhr.loaded/xhr.total*100):0;
      barEl.style.width=p+'%'; barTextEl.textContent=p+'%';
      setStatus(`下载模型 ${p}%...`);
    },
    (err) => {
      console.error('GLB error:',err);
      barTextEl.textContent='加载失败'; errEl.textContent='错误: '+(err.message||'未知'); errEl.style.display='block';
      setStatus('模型加载失败');
    }
  );

  // === Animation (position-based, NO scale deformation) ===
  const clock = new THREE.Clock();
  function tick() {
    requestAnimationFrame(tick);
    const t = clock.getElapsedTime();
    controls.autoRotate=autoRot; controls.autoRotateSpeed=0.7; controls.update();

    if(modelGroup && bounceOn) {
      const b = bounciness;
      // Gentle bob (position only, no scale change)
      const bobY = Math.sin(t * 1.8) * 0.04 * b;
      // Gentle sway rotation
      const swayY = Math.sin(t * 1.2) * 0.03 * b;
      const tiltZ = Math.sin(t * 0.8) * 0.02 * b;
      const tiltX = Math.sin(t * 1.0) * 0.01 * b;
      // Subtle bounce every ~5s (position only)
      const cycle = (t % 5.0) / 5.0;
      let jumpY = 0;
      if(cycle < 0.12) {
        jumpY = -Math.sin(cycle/0.12 * Math.PI) * 0.03 * b;
      } else if(cycle < 0.3) {
        jumpY = Math.sin((cycle-0.12)/0.18 * Math.PI) * 0.1 * b;
      }

      modelGroup.position.y = bobY + jumpY;
      modelGroup.rotation.y = swayY;
      modelGroup.rotation.z = tiltZ;
      modelGroup.rotation.x = tiltX;
      // NO scale changes - proportions stay perfect
    }

    // Green spores
    if(particlesOn) {
      const sa=sGeo.attributes.position.array;
      for(let i=0;i<SN;i++){sa[i*3+1]+=sS[i]*0.003;sa[i*3]+=Math.sin(t+sPh[i])*0.001;
        if(sa[i*3+1]>3.2){sa[i*3+1]=0;const a=Math.random()*Math.PI*2,r=.4+Math.random()*1.4;sa[i*3]=Math.cos(a)*r;sa[i*3+2]=Math.sin(a)*r}}
      sGeo.attributes.position.needsUpdate=true;
      sMat.opacity=0.35+Math.sin(t*1.8)*0.15;
    }

    // Pink glow
    if(particlesOn) {
      const pa=pGeo.attributes.position.array;
      for(let i=0;i<PN;i++){pa[i*3+1]+=pS[i]*0.004;pa[i*3]+=Math.sin(t*1.3+pPh[i])*0.002;
        if(pa[i*3+1]>3.5){pa[i*3+1]=-0.3;const a=Math.random()*Math.PI*2,r=.6+Math.random()*1.6;pa[i*3]=Math.cos(a)*r;pa[i*3+2]=Math.sin(a)*r}}
      pGeo.attributes.position.needsUpdate=true;
      pMat.opacity=0.3+Math.sin(t*1.5)*0.12;
    }

    if(bloomOn){bloomPass.enabled=true;composer.render()}
    else{bloomPass.enabled=false;renderer.render(scene,camera)}
  }
  resize(); tick();

  // === UI ===
  document.getElementById('btn-rotate').onclick=e=>{autoRot=!autoRot;e.target.textContent=autoRot?'开':'关';e.target.classList.toggle('active',autoRot)};
  document.getElementById('btn-bounce').onclick=e=>{bounceOn=!bounceOn;e.target.textContent=bounceOn?'开':'关';e.target.classList.toggle('active',bounceOn);
    if(!bounceOn&&modelGroup){modelGroup.rotation.set(0,0,0);modelGroup.position.y=0}};
  document.getElementById('btn-hearts').onclick=e=>{particlesOn=!particlesOn;e.target.textContent=particlesOn?'开':'关';e.target.classList.toggle('active',particlesOn);
    scene.traverse(o=>{if(o.isPoints)o.visible=particlesOn})};
  document.getElementById('btn-bloom').onclick=e=>{bloomOn=!bloomOn;e.target.textContent=bloomOn?'开':'关';e.target.classList.toggle('active',bloomOn)};

  const V={front:[0,1,3],side:[3,1,0.3],back:[0,1,-3],cute:[0.5,0.8,1.6]};
  document.querySelectorAll('[data-view]').forEach(btn=>{btn.onclick=()=>{
    document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
    const p=V[btn.dataset.view];if(!p)return;
    autoRot=false;document.getElementById('btn-rotate').textContent='关';document.getElementById('btn-rotate').classList.remove('active');
    const s=camera.position.clone(),e=new THREE.Vector3(...p),t0=performance.now();
    (function step(){const t=Math.min(1,(performance.now()-t0)/600),e2=1-Math.pow(1-t,3);camera.position.lerpVectors(s,e,e2);if(t<1)requestAnimationFrame(step)})();
  }});
  document.getElementById('bounciness').oninput=e=>{bounciness=parseFloat(e.target.value)/100};

} catch(e) {
  console.error('Init error:',e);
  setStatus('初始化失败: '+e.message);
  errEl.textContent='初始化错误: '+e.message; errEl.style.display='block';
  barTextEl.textContent='模块加载失败';
}
</script>
</body>
</html>
